name: Deploy to cPanel

on:
  push:
    branches:
      - main
  # Adds a "Run workflow" button under the Actions tab for manual deploys.
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync files to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🚀 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Folder on the server, relative to the FTP account's home.
          # Set a repository variable FTP_SERVER_DIR (for example ./public_html/)
          # if your FTP account does not open straight into the website folder.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
          # config.php holds the live database password, so it is edited on the
          # server only. Uploaded media in uploads/<folder>/ is never touched,
          # but uploads/.htaccess (which blocks scripts) is deployed.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*/**
            config.local.php
            config.php
            storage/database.sqlite*
            storage/installed.lock
            uploads/*/**
            .claude/**
            .gemini/**
